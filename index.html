<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyArea24 — AI-Powered Local Intelligence Network</title>
    <meta name="description" content="MyArea24 — Hyper-local neighbourhood intelligence network. Real-time CPCB air quality, Open-Meteo weather forecasts, traffic corridors, APMC mandi rates, verified neighbourhood stores & civic alerts." />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="canonical" href="https://aidivi265.github.io/myarea24-frontend/" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aidivi265.github.io/myarea24-frontend/" />
    <meta property="og:title" content="MyArea24 — AI-Powered Local Intelligence Network" />
    <meta property="og:description" content="Real-time CPCB air quality, weather, traffic, mandi rates & neighbourhood discovery across India." />
    <meta property="og:site_name" content="MyArea24" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://aidivi265.github.io/myarea24-frontend/" />
    <meta name="twitter:title" content="MyArea24 — AI-Powered Local Intelligence Network" />
    <meta name="twitter:description" content="Real-time CPCB air quality, weather, traffic, mandi rates & neighbourhood discovery across India." />

    <!-- Preconnect & Non-render-blocking Google Fonts with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Preload Mobile LCP Hero Image -->
    <link rel="preload" as="image" href="./assets/crops/hero-art-home.webp" type="image/webp" fetchpriority="high" />

    <!-- Structured Data (JSON-LD) for Local Intelligence Platform -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MyArea24",
      "url": "https://aidivi265.github.io/myarea24-frontend/",
      "description": "Hyper-local neighbourhood intelligence network integrating real-time weather, air quality, traffic, commodity rates, and community discovery.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://aidivi265.github.io/myarea24-frontend/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- SPA Redirect Router for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#F4F6FB] text-slate-900 antialiased selection:bg-indigo-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
