# ==============================================================================
# MyArea24 — Staging Nginx Configuration (Reverse Proxy & Security Hardening)
# ==============================================================================

# Rate Limiting Zones: 30 req/sec for general API, 5 req/sec for Auth OTP endpoints
limit_req_zone $binary_remote_addr zone=staging_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=staging_auth:10m rate=5r/s;

# Upstream FastAPI application cluster with connection pooling
upstream fastapi_staging {
    server backend_staging:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirection & Let's Encrypt Challenge Resolver
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name staging.myarea24.in;

    # Allow Let's Encrypt / Certbot ACME HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Staging Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.myarea24.in;

    # SSL TLS Certificates (Managed by Certbot or Cloud Provider)
    ssl_certificate /etc/letsencrypt/live/staging.myarea24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.myarea24.in/privkey.pem;

    # Modern TLS Security Parameters (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.sarvam.ai https://checkout.razorpay.com wss://$host https:; frame-src 'self' https://api.razorpay.com;" always;

    # GZip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 500;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root Directory for SPA Static Files
    root /usr/share/nginx/html;
    index index.html;

    # Static Assets with Long-Term Immutable Caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Health & Readiness Probes (Unthrottled for Container Orchestrator)
    # --------------------------------------------------------------------------
    location = /health {
        proxy_pass http://fastapi_staging/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location = /ready {
        proxy_pass http://fastapi_staging/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Authentication & OTP Endpoints (Strict Rate Limiting: 5 req/s)
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=staging_auth burst=10 nodelay;
        proxy_pass http://fastapi_staging/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # General REST API Endpoints (Rate Limiting: 30 req/s)
    # Handles both /api and /api/ prefixed endpoints cleanly
    # --------------------------------------------------------------------------
    location /api {
        limit_req zone=staging_api burst=50 nodelay;
        proxy_pass http://fastapi_staging;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # WebSocket Real-Time Channel with Protocol Upgrade
    # --------------------------------------------------------------------------
    location /api/v1/ws {
        proxy_pass http://fastapi_staging/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # React SPA Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
