# ==============================================================================
# MyArea24 — Staging Nginx Configuration (HTTP-only / Edge SSL Terminated)
# Use this when SSL/TLS is terminated at the cloud load balancer (e.g. Cloudflare,
# AWS ALB, GCP Cloud Load Balancer) or for bootstrapping without Certbot.
# ==============================================================================

limit_req_zone $binary_remote_addr zone=staging_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=staging_auth:10m rate=5r/s;

upstream fastapi_staging {
    server backend_staging:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.myarea24.in localhost;

    # Allow Let's Encrypt / Certbot ACME HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GZip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 500;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /health {
        proxy_pass http://fastapi_staging/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location = /ready {
        proxy_pass http://fastapi_staging/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location /api/v1/auth/ {
        limit_req zone=staging_auth burst=10 nodelay;
        proxy_pass http://fastapi_staging/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api {
        limit_req zone=staging_api burst=50 nodelay;
        proxy_pass http://fastapi_staging;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /api/v1/ws {
        proxy_pass http://fastapi_staging/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
